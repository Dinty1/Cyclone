# Layout of guild settings
# Input types (not all implemented): boolean, string-short, string-long, time, number, select-string, select-user, select-role, select-mentionable, select-channel

mod_log:
  title: ModLog Settings
  description: |
    Settings for moderator action logging. Also includes the ability to track the adding/removing of given roles in this channel.
    **NB:** "View Audit Log" permission is mandatory as well as "View Channel", "Send Messages" and "Embed Links" in the channel itself!
  channel:
    name: ModLog Channel
    type: select-channel
    multiple: false
    required: false
  actions:
    name: Actions to Log
    type: select-string
    options: 
      - id: BAN
        label: Bans
      - id: UNBAN
        label: Unbans  
      - id: KICK
        label: Kicks  
      - id: TIMEOUT
        label: Timeouts
      - id: TIMEOUT_REMOVE
        label: Timeout Removals 
    multiple: true
    required: false
  tracked_roles:
    name: Tracked Roles
    type: select-role
    multiple: true
    required: false